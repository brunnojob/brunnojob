name: Sync GitHub profile metrics
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-activity.yml'
      - '.github/scripts/profile_activity.py'
permissions:
  contents: write
concurrency:
  group: profile-activity
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate metrics from GitHub GraphQL
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/profile_activity.py
      - name: Publish refreshed profile card
        run: |
          git add assets/profile/profile-live.svg
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Sync GitHub profile metrics'
          git pull --rebase origin main
          git push
