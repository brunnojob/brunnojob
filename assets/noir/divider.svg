<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 46" width="1200" height="46" role="img" aria-label="film strip divider">
<title>film strip divider</title>
<style>.roll{animation:roll 1.6s linear infinite}@keyframes roll{to{transform:translateX(-40px)}}
.roll2{animation:roll2 9.6s linear infinite}@keyframes roll2{to{transform:translateX(-240px)}}
.display{font-family:'NoirDisplay',Georgia,'Times New Roman',serif;font-weight:900;fill:#f2efe9}
.type{font-family:'NoirType','Courier New',monospace;fill:#f2efe9}
.red{fill:#b3001b}
.flicker{animation:flicker 5s steps(1) infinite}
@keyframes flicker{0%{opacity:1}7%{opacity:.86}8%{opacity:1}31%{opacity:.93}32%{opacity:1}55%{opacity:.8}56%{opacity:1}57%{opacity:.9}58%{opacity:1}83%{opacity:.95}84%{opacity:1}}
.scratch{animation:scratch 3.3s steps(1) infinite}
@keyframes scratch{0%{transform:translateX(0);opacity:.35}12%{transform:translateX(410px);opacity:0}30%{transform:translateX(-220px);opacity:.25}46%{transform:translateX(640px);opacity:0}63%{transform:translateX(150px);opacity:.3}80%{transform:translateX(880px);opacity:.15}}
.dust{animation:dust 2.1s steps(1) infinite}
@keyframes dust{0%{opacity:.7}9%{opacity:0}100%{opacity:0}}
.blink{animation:blink 1.2s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
