<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 565" width="560" height="565" role="img" aria-labelledby="title">
<title id="title">GitHub activity and repository languages, synchronized from GitHub</title>
<defs><linearGradient id="ambient"><stop offset="0%" stop-color="#101c2b"/><stop offset="50%" stop-color="#203c55"/><stop offset="100%" stop-color="#101c2b"/></linearGradient></defs>
<style>
@keyframes ambient {to {transform:translateX(-560px)}}
.ambient {animation:ambient 9s ease-in-out infinite alternate}
@keyframes drift { to { transform:translateX(260px) } }
.glow { animation:drift 5s ease-in-out infinite alternate }
@media(prefers-reduced-motion:reduce) {.glow,.ambient {animation:none}}
.label {font:14px system-ui,sans-serif;fill:#a9c4df}
.number {font:bold 25px system-ui,sans-serif;fill:#f3f8ff}
.small {font:11px system-ui,sans-serif;fill:#a9c4df}
</style>
<rect x="1" y="1" width="558" height="563" rx="17" fill="#101c2b" stroke="#2a4766" stroke-width="2"/><rect class="ambient" x="0" y="0" width="1120" height="565" opacity=".23" fill="url(#ambient)" pointer-events="none"/>
